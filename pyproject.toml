[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rltrader"
version = "0.1.0"
description = "Deep reinforcement learning for single-asset trading, with honest evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "gymnasium",
    "yfinance",
    "scipy",
    "lightgbm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
